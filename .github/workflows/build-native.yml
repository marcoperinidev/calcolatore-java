name: Build native packages

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:

  prepare:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IS_RELEASE="true"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
            IS_RELEASE="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

          echo "Building version: $VERSION"
          echo "Release build: $IS_RELEASE"

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes


  build-windows:
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JavaFX runtime
        run: mvn --batch-mode clean javafx:jlink

      - name: Create Windows app image
        run: >
          jpackage
          --type app-image
          --name Calcolatore
          --app-version ${{ needs.prepare.outputs.version }}
          --module it.volta.calcolatore/it.volta.calcolatore.Launcher
          --runtime-image target/app
          --dest dist-app

      - name: Build Windows installer with Inno Setup
        shell: powershell
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\calcolatore.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Calcolatore-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish Windows installer to Release
        if: needs.prepare.outputs.is_release == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            "dist/Calcolatore-Setup-${{ needs.prepare.outputs.version }}.exe" `
            --repo "${{ github.repository }}" `
            --clobber


  build-linux:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Build JavaFX runtime
        run: mvn --batch-mode clean javafx:jlink

      - name: Create Linux package
        run: >
          jpackage
          --type deb
          --name Calcolatore
          --app-version ${{ needs.prepare.outputs.version }}
          --module it.volta.calcolatore/it.volta.calcolatore.Launcher
          --runtime-image target/app
          --dest dist
          --linux-shortcut

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: Calcolatore-Linux
          path: dist/*.deb
          if-no-files-found: error

      - name: Publish Linux package to Release
        if: needs.prepare.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/*.deb \
            --repo "${{ github.repository }}" \
            --clobber


  build-macos:
    needs: prepare
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JavaFX runtime
        run: mvn --batch-mode clean javafx:jlink

      - name: Create macOS package
        run: >
          jpackage
          --type dmg
          --name Calcolatore
          --app-version ${{ needs.prepare.outputs.version }}
          --module it.volta.calcolatore/it.volta.calcolatore.Launcher
          --runtime-image target/app
          --dest dist

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: Calcolatore-macOS
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish macOS package to Release
        if: needs.prepare.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/*.dmg \
            --repo "${{ github.repository }}" \
            --clobber